    <path d="M1005 264 V288 M1000 283 L1005 290 L1010 283" fill="none" stroke="#6FA3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="edge-line"/>
  </g>

  <!-- ==================== LAYER 02 ==================== -->
  <g>
    <rect x="48" y="292" width="1104" height="148" rx="16" fill="#20242B" stroke="#5FAE8F" stroke-width="1.5" data-fill-role="surface" data-stroke-role="compute-line" filter="url(#card-shadow)"/>
    <rect x="68" y="308" width="184" height="24" rx="12" fill="#263A37" data-fill-role="compute-fill"/>
    <text x="160" y="320" font-size="11.5" font-weight="700" letter-spacing="0.05em" fill="#BFDFD2" data-fill-role="compute-ink" text-anchor="middle" dominant-baseline="central">LAYER 02 · CORE ENGINE</text>
    <text x="266" y="320" font-size="16" font-weight="700" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">결정론적 MD5 시드 스크리닝 &amp; 4대 증거 수집 레인</text>
    <text x="665" y="320" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">screening.py 시드 배치 · audit.py 동적 Decimal 무오차 연산</text>

    <!-- Node 2.1 -->
    <rect x="68" y="344" width="252" height="80" rx="10" fill="#263A37" stroke="#5FAE8F" stroke-width="1" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
    <text x="82" y="366" font-size="14.5" font-weight="700" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">레인 1 · 교차계약 (계약단가)</text>
    <text x="82" y="390" font-size="13" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">동일 품목 타 계약 저가 등재 탐색</text>
    <text x="82" y="410" font-size="12.5" font-weight="600" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">crosscontract · 시점 유효성 증명</text>

    <!-- Node 2.2 -->
    <rect x="338" y="344" width="252" height="80" rx="10" fill="#263A37" stroke="#5FAE8F" stroke-width="1" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
    <text x="352" y="366" font-size="14.5" font-weight="700" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">레인 2 · 소매 최저가 (시중단가)</text>
    <text x="352" y="390" font-size="13" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">다나와 JSON-LD · 12개월 최저가</text>
    <text x="352" y="410" font-size="12.5" font-weight="600" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">retail/shops · 18개 전문몰 파싱</text>

    <!-- Node 2.3 -->
    <rect x="608" y="344" width="252" height="80" rx="10" fill="#263A37" stroke="#5FAE8F" stroke-width="1" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
    <text x="622" y="366" font-size="14.5" font-weight="700" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">레인 3 · 타기관 납품 (기관단가)</text>
    <text x="622" y="390" font-size="13" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">동일 계약·물품 타 수요기관 대조</text>
    <text x="622" y="410" font-size="12.5" font-weight="600" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">agencylane · 180일 · 2개 기관</text>

    <!-- Node 2.4 -->
    <rect x="878" y="344" width="254" height="80" rx="10" fill="#263A37" stroke="#5FAE8F" stroke-width="1" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
    <text x="892" y="366" font-size="14.5" font-weight="700" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">레인 4 · 부품 레시피 (조립단가)</text>
    <text x="892" y="390" font-size="13" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">데스크톱·패치판넬·랙 32종 합산</text>
    <text x="892" y="410" font-size="12.5" font-weight="600" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">recipe.py · 표준품셈 · 이중 검증</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <g>
    <path d="M194 440 V464 M189 459 L194 466 L199 459" fill="none" stroke="#5FAE8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="compute-line"/>
