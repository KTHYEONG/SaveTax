    <path d="M1005 440 V464 M1000 459 L1005 466 L1010 459" fill="none" stroke="#5FAE8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="compute-line"/>
  </g>

  <!-- ==================== LAYER 03 ==================== -->
  <g>
    <rect x="48" y="468" width="1104" height="140" rx="16" fill="#20242B" stroke="#5FAE8F" stroke-width="1.5" data-fill-role="surface" data-stroke-role="compute-line" filter="url(#card-shadow)"/>
    <rect x="68" y="484" width="212" height="24" rx="12" fill="#263A37" data-fill-role="compute-fill"/>
    <text x="174" y="496" font-size="11.5" font-weight="700" letter-spacing="0.05em" fill="#BFDFD2" data-fill-role="compute-ink" text-anchor="middle" dominant-baseline="central">LAYER 03 · PREFLIGHT GUARD</text>
    <text x="294" y="496" font-size="16" font-weight="700" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">변형·계열 오비교 차단 게이트 &amp; 실시간 사전 검증</text>
    <text x="695" y="496" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">숨은 옵션·일반/내진 계열 분리 · 제출 직전 단가 재검증</text>

    <!-- Node 3.1 -->
    <rect x="68" y="520" width="252" height="72" rx="10" fill="#31353B" stroke="#9EA6B0" stroke-width="1" data-fill-role="data-fill" data-stroke-role="data-line"/>
    <text x="82" y="543" font-size="14.5" font-weight="700" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">변형·계열 게이트 (variants.py)</text>
    <text x="82" y="569" font-size="13" font-weight="600" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">다중옵션 최고가 · 17개 순번블록</text>

    <!-- Node 3.2 -->
    <rect x="338" y="520" width="252" height="72" rx="10" fill="#31353B" stroke="#9EA6B0" stroke-width="1" data-fill-role="data-fill" data-stroke-role="data-line"/>
    <text x="352" y="543" font-size="14.5" font-weight="700" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">단위 정규화 엔진 (units.py)</text>
    <text x="352" y="569" font-size="13" font-weight="600" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">조·세트·식 매핑 · 라벨 충돌 주석</text>

    <!-- Node 3.3 -->
    <rect x="608" y="520" width="252" height="72" rx="10" fill="#31353B" stroke="#9EA6B0" stroke-width="1" data-fill-role="data-fill" data-stroke-role="data-line"/>
    <text x="622" y="543" font-size="14.5" font-weight="700" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">실시간 Preflight (workflow.py)</text>
    <text x="622" y="569" font-size="13" font-weight="600" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">인용 URL 재조회 · 가격 변동 차단</text>

    <!-- Node 3.4 -->
    <rect x="878" y="520" width="254" height="72" rx="10" fill="#31353B" stroke="#9EA6B0" stroke-width="1" data-fill-role="data-fill" data-stroke-role="data-line"/>
    <text x="892" y="543" font-size="14.5" font-weight="700" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">리메디에이션 (remediation.py)</text>
    <text x="892" y="569" font-size="13" font-weight="600" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">기제출 유지·수정·철회 자동 분류</text>
  </g>

