  </g>

  <!-- ==================== LAYER 04 ==================== -->
  <g>
    <rect x="48" y="636" width="1104" height="128" rx="16" fill="#20242B" stroke="#9490C6" stroke-width="1.5" data-fill-role="surface" data-stroke-role="api-line" filter="url(#card-shadow)"/>
    <rect x="68" y="652" width="212" height="24" rx="12" fill="#323343" data-fill-role="api-fill"/>
    <text x="174" y="664" font-size="11.5" font-weight="700" letter-spacing="0.05em" fill="#D4D3E8" data-fill-role="api-ink" text-anchor="middle" dominant-baseline="central">LAYER 04 · LEDGER &amp; SUBMIT</text>
