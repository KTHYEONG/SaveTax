    <text x="695" y="664" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">배타적 파일 락(flock) · fsync 내구성 보장 · 전 계층 PAT 마스킹</text>

    <!-- Node 4.1 -->
