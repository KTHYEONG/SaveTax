    <text x="82" y="731" font-size="13" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">APPROVE 챌린지 · 본문 위변조 차단</text>

    <!-- Node 4.2 -->
    <rect x="338" y="686" width="252" height="64" rx="10" fill="#323343" stroke="#9490C6" stroke-width="1" data-fill-role="api-fill" data-stroke-role="api-line"/>
    <text x="352" y="707" font-size="14.5" font-weight="700" fill="#D4D3E8" data-fill-role="api-ink" dominant-baseline="central">크래시 복구 원장 (ledger.py)</text>
    <text x="352" y="731" font-size="13" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">0600 권한 · flock+fsync 선기록</text>

    <!-- Node 4.3 -->
    <rect x="608" y="686" width="252" height="64" rx="10" fill="#323343" stroke="#9490C6" stroke-width="1" data-fill-role="api-fill" data-stroke-role="api-line"/>
    <text x="622" y="707" font-size="14.5" font-weight="700" fill="#D4D3E8" data-fill-role="api-ink" dominant-baseline="central">멱등 제출·폴링 (submissions)</text>
    <text x="622" y="731" font-size="13" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">Idempotency-Key · 서킷브레이커</text>

    <!-- Node 4.4 -->
    <rect x="878" y="686" width="254" height="64" rx="10" fill="#323343" stroke="#9490C6" stroke-width="1" data-fill-role="api-fill" data-stroke-role="api-line"/>
    <text x="892" y="707" font-size="14.5" font-weight="700" fill="#D4D3E8" data-fill-role="api-ink" dominant-baseline="central">자격증명 마스킹 (redaction.py)</text>
    <text x="892" y="731" font-size="13" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">Secret 래퍼 · 예외·로그 자동 마스킹</text>
