<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" role="img" style="font-family:Pretendard, 'Malgun Gothic', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>SaveTax 4계층 시스템 아키텍처 토폴로지 및 생명주기</title>
  <desc>외부 조달 카탈로그·보안 통신 계층부터 4대 증거 수집 코어, 사전 검증(Preflight)·리메디에이션 가드, 승인 원장·멱등성 제출 계층에 이르는 4계층 파이프라인 아키텍처</desc>
  <defs>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" data-paint-static="true"/>
    </filter>
  </defs>
  <rect width="1200" height="790" fill="#16191E" data-fill-role="canvas"/>

  <!-- Header -->
  <g>
    <rect x="48" y="40" width="6" height="46" rx="3" fill="#6FA3D3" data-fill-role="focus"/>
    <text x="68" y="32" font-size="13.5" font-weight="700" letter-spacing="0.06em" fill="#C5DAED" data-fill-role="edge-ink" dominant-baseline="central">SYSTEM ARCHITECTURE &amp; LIFECYCLE TOPOLOGY</text>
    <text x="68" y="64" font-size="26" font-weight="700" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">카탈로그 정규화부터 4대 증거 수집·사전 검증·원장 제출까지의 4계층 아키텍처</text>
    <text x="68" y="96" font-size="15" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">무인증 공개 수집기와 PAT 허용 목록 통신의 물리적 격리 · DuckDB 뷰 정규화 · 실시간 Preflight 및 감사 원장(flock+fsync)</text>
  </g>

  <!-- ==================== LAYER 01 ==================== -->
  <g>
    <rect x="48" y="124" width="1104" height="140" rx="16" fill="#20242B" stroke="#6FA3D3" stroke-width="1.5" data-fill-role="surface" data-stroke-role="edge-line" filter="url(#card-shadow)"/>
    <rect x="68" y="140" width="176" height="24" rx="12" fill="#2A3746" data-fill-role="edge-fill"/>
    <text x="156" y="152" font-size="11.5" font-weight="700" letter-spacing="0.05em" fill="#C5DAED" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">LAYER 01 · DATA &amp; I/O</text>
    <text x="258" y="152" font-size="16" font-weight="700" fill="#C5DAED" data-fill-role="edge-ink" dominant-baseline="central">외부 데이터 프로젝션 &amp; 보안 통신 격리 계층</text>
    <text x="615" y="152" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">DuckDB 인메모리 뷰 정규화 · 3단계 네트워크 진단 · PAT 호스트 격리</text>

    <!-- Node 1.1 -->
    <rect x="68" y="176" width="252" height="72" rx="10" fill="#2A3746" stroke="#6FA3D3" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="82" y="199" font-size="14.5" font-weight="700" fill="#C5DAED" data-fill-role="edge-ink" dominant-baseline="central">카탈로그 뷰 엔진 (dataset.py)</text>
    <text x="82" y="225" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">105.2만 행 Parquet · 납품키 정규화</text>

    <!-- Node 1.2 -->
    <rect x="338" y="176" width="252" height="72" rx="10" fill="#2A3746" stroke="#6FA3D3" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="352" y="199" font-size="14.5" font-weight="700" fill="#C5DAED" data-fill-role="edge-ink" dominant-baseline="central">보안 통신·진단 (http.py)</text>
    <text x="352" y="225" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">3단계 통신 진단 · 리다이렉트 차단</text>

    <!-- Node 1.3 -->
    <rect x="608" y="176" width="252" height="72" rx="10" fill="#2A3746" stroke="#6FA3D3" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="622" y="199" font-size="14.5" font-weight="700" fill="#C5DAED" data-fill-role="edge-ink" dominant-baseline="central">조달·대회 API (rawapi.py)</text>
    <text x="622" y="225" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">납품요구 상세 · 품목 속성 조회</text>

    <!-- Node 1.4 -->
    <rect x="878" y="176" width="254" height="72" rx="10" fill="#2A3746" stroke="#6FA3D3" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="892" y="199" font-size="14.5" font-weight="700" fill="#C5DAED" data-fill-role="edge-ink" dominant-baseline="central">무인증 웹 수집 (publicweb.py)</text>
    <text x="892" y="225" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">다나와·전문몰 · CP949 디코딩</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <g>
    <path d="M194 264 V288 M189 283 L194 290 L199 283" fill="none" stroke="#6FA3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="edge-line"/>
    <path d="M464 264 V288 M459 283 L464 290 L469 283" fill="none" stroke="#6FA3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="edge-line"/>
