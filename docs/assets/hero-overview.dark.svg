<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" style="font-family:Pretendard, 'Malgun Gothic', Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>SaveTax 핵심 엔지니어링 보장 지표 및 4단계 감사·제보 파이프라인</title>
  <desc>105.2만 건 나라장터 카탈로그 중복 제거(23.87% 과대계상 차단), 4대 증거 레인 및 동적 Decimal 무오차 연산, SHA-256 승인 원장 및 1,513개 테스트로 검증된 공공조달 과다 집행 자동 감사 엔진 개요</desc>
  <defs>
    <filter id="card-shadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06" data-paint-static="true"/>
    </filter>
  </defs>
  <rect width="1200" height="580" fill="#16191E" data-fill-role="canvas"/>

  <!-- Header -->
  <g>
    <rect x="48" y="42" width="6" height="46" rx="3" fill="#6FA3D3" data-fill-role="focus"/>
    <text x="68" y="34" font-size="13.5" font-weight="700" letter-spacing="0.06em" fill="#C5DAED" data-fill-role="edge-ink" dominant-baseline="central">SAVETAX · PUBLIC PROCUREMENT AUDIT &amp; WHISTLEBLOWING ENGINE</text>
    <text x="68" y="66" font-size="28" font-weight="700" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">105.2만 건 조달 카탈로그 정밀 정규화 &amp; 4대 레인 교차검증 제보 엔진</text>
    <text x="68" y="99" font-size="15.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">납품요구 키 중복 23.87% 원천 차단 · 동적 정밀도 Decimal 무오차 연산 · SHA-256 챌린지 승인 및 멱등성 원장</text>
  </g>

  <!-- 3 KPI Cards -->
  <!-- Card 1: Catalog & Deduplication -->
  <g>
    <rect x="48" y="132" width="352" height="248" rx="16" fill="#20242B" stroke="#6FA3D3" stroke-width="1.5" data-fill-role="surface" data-stroke-role="edge-line" filter="url(#card-shadow)"/>
    <rect x="70" y="154" width="188" height="28" rx="14" fill="#2A3746" stroke="#6FA3D3" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="164" y="168" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#C5DAED" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">CATALOG DEDUPLICATION</text>
    <circle cx="358" cy="168" r="22" fill="#2A3746" data-fill-role="edge-fill"/>
    <g transform="translate(346,156) scale(1)"><path d="M5 6 C5 4.3 8.1 3 12 3 C15.9 3 19 4.3 19 6 V18 C19 19.7 15.9 21 12 21 C8.1 21 5 19.7 5 18 Z M5 6 C5 7.7 8.1 9 12 9 C15.9 9 19 7.7 19 6 M5 12 C5 13.7 8.1 15 12 15 C15.9 15 19 13.7 19 12" fill="none" stroke="#6FA3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="edge-line"/></g>

    <text x="70" y="238" font-size="46" font-weight="700" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">105.2만 건</text>
    <text x="70" y="292" font-size="18.5" font-weight="700" fill="#C5DAED" data-fill-role="edge-ink" dominant-baseline="central">중복 과대계상 23.87% 원천 차단</text>
    <text x="70" y="324" font-size="14.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">300,431개 고유 납품요구 키 정규화</text>
    <text x="70" y="350" font-size="14.5" font-weight="600" fill="#C5DAED" data-fill-role="edge-ink" dominant-baseline="central">실측 주문 모수 17.57조 원 무결성 검증</text>
  </g>

  <!-- Card 2: 4-Lane Evidence & Decimal Audit -->
  <g>
    <rect x="424" y="132" width="352" height="248" rx="16" fill="#20242B" stroke="#5FAE8F" stroke-width="1.5" data-fill-role="surface" data-stroke-role="compute-line" filter="url(#card-shadow)"/>
    <rect x="446" y="154" width="184" height="28" rx="14" fill="#263A37" stroke="#5FAE8F" stroke-width="1" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
    <text x="538" y="168" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#BFDFD2" data-fill-role="compute-ink" text-anchor="middle" dominant-baseline="central">MULTI-LANE EVIDENCE</text>
    <circle cx="734" cy="168" r="22" fill="#263A37" data-fill-role="compute-fill"/>
    <g transform="translate(722,156) scale(1)"><path d="M12 2 L12 22 M7 6 H15 A3 3 0 0 1 15 12 H9 A3 3 0 0 0 9 18 H17" fill="none" stroke="#5FAE8F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="compute-line"/></g>

    <text x="446" y="238" font-size="46" font-weight="700" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">4대 증거 레인</text>
    <text x="446" y="292" font-size="18.5" font-weight="700" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">동적 Decimal 무오차 연산 (오차 0건)</text>
    <text x="446" y="324" font-size="14.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">교차계약 · 소매 최저가 · 타기관 · 레시피</text>
    <text x="446" y="350" font-size="14.5" font-weight="600" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">29개 허용 판매처 · 32종 부품 교차검증</text>
  </g>

  <!-- Card 3: Verification, Security & Idempotency -->
  <g>
    <rect x="800" y="132" width="352" height="248" rx="16" fill="#20242B" stroke="#9490C6" stroke-width="1.5" data-fill-role="surface" data-stroke-role="api-line" filter="url(#card-shadow)"/>
    <rect x="822" y="154" width="184" height="28" rx="14" fill="#323343" stroke="#9490C6" stroke-width="1" data-fill-role="api-fill" data-stroke-role="api-line"/>
    <text x="914" y="168" font-size="12" font-weight="700" letter-spacing="0.05em" fill="#D4D3E8" data-fill-role="api-ink" text-anchor="middle" dominant-baseline="central">IDEMPOTENT GUARD</text>
    <circle cx="1110" cy="168" r="22" fill="#323343" data-fill-role="api-fill"/>
    <g transform="translate(1098,156) scale(1)"><path d="M12 3 L20 6 V12 C20 17 16 20 12 21 C8 20 4 17 4 12 V6 Z M9 12 L11 14 L15 10" fill="none" stroke="#9490C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="api-line"/></g>

    <text x="822" y="238" font-size="46" font-weight="700" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">1,513 Tests</text>
    <text x="822" y="292" font-size="18.5" font-weight="700" fill="#D4D3E8" data-fill-role="api-ink" dominant-baseline="central">중복 청구 0건 · 토큰 유출 0건</text>
    <text x="822" y="324" font-size="14.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">SHA-256 챌린지 승인 · flock 감사 원장</text>
    <text x="822" y="350" font-size="14.5" font-weight="600" fill="#D4D3E8" data-fill-role="api-ink" dominant-baseline="central">mypy --strict 100% · 52개 모듈 통과</text>
  </g>

  <!-- Bottom 4-Stage Horizontal Pipeline Strip -->
  <g>
    <rect x="48" y="404" width="1104" height="142" rx="16" fill="#20242B" stroke="#6FA3D3" stroke-width="1.5" data-fill-role="surface" data-stroke-role="edge-line" filter="url(#card-shadow)"/>
    <rect x="70" y="422" width="248" height="24" rx="12" fill="#2A3746" data-fill-role="edge-fill"/>
    <text x="194" y="434" font-size="11.5" font-weight="700" letter-spacing="0.06em" fill="#C5DAED" data-fill-role="edge-ink" text-anchor="middle" dominant-baseline="central">END-TO-END AUDIT PIPELINE</text>
    <text x="334" y="434" font-size="14.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">카탈로그 프로젝션부터 4대 증거 수집, 실시간 단가 재검증(Preflight), 멱등성 원장 제출까지 단일 파이프라인 구동</text>

    <!-- Stage 1 -->
    <rect x="70" y="460" width="246" height="68" rx="10" fill="#2A3746" stroke="#6FA3D3" stroke-width="1" data-fill-role="edge-fill" data-stroke-role="edge-line"/>
    <text x="84" y="483" font-size="15.5" font-weight="700" fill="#C5DAED" data-fill-role="edge-ink" dominant-baseline="central">01. 카탈로그 정규화 &amp; 시드</text>
    <text x="84" y="509" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">납품키 중복제거 · MD5 시드 배치</text>

    <!-- Chevron 1 -->
    <path d="M324 487 L334 494 L324 501" fill="none" stroke="#6FA3D3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="focus"/>

    <!-- Stage 2 -->
    <rect x="342" y="460" width="246" height="68" rx="10" fill="#263A37" stroke="#5FAE8F" stroke-width="1" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
    <text x="356" y="483" font-size="15.5" font-weight="700" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">02. 4대 레인 증거 수집</text>
    <text x="356" y="509" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">교차계약 · 소매 · 타기관 · 레시피</text>

    <!-- Chevron 2 -->
    <path d="M596 487 L606 494 L596 501" fill="none" stroke="#5FAE8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="positive"/>

    <!-- Stage 3 -->
    <rect x="614" y="460" width="246" height="68" rx="10" fill="#263A37" stroke="#5FAE8F" stroke-width="1" data-fill-role="compute-fill" data-stroke-role="compute-line"/>
    <text x="628" y="483" font-size="15.5" font-weight="700" fill="#BFDFD2" data-fill-role="compute-ink" dominant-baseline="central">03. 변형 게이트 &amp; Preflight</text>
    <text x="628" y="509" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">옵션·계열 분리 · 실시간 단가 대조</text>

    <!-- Chevron 3 -->
    <path d="M868 487 L878 494 L868 501" fill="none" stroke="#9490C6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="api-line"/>

    <!-- Stage 4 -->
    <rect x="886" y="460" width="244" height="68" rx="10" fill="#323343" stroke="#9490C6" stroke-width="1" data-fill-role="api-fill" data-stroke-role="api-line"/>
    <text x="900" y="483" font-size="15.5" font-weight="700" fill="#D4D3E8" data-fill-role="api-ink" dominant-baseline="central">04. 해시 승인 &amp; 원장 제출</text>
    <text x="900" y="509" font-size="13.5" font-weight="600" fill="#E9ECEF" data-fill-role="ink" dominant-baseline="central">챌린지 서명 · 멱등성 키 원장 기록</text>
  </g>
</svg>
